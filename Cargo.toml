[package]
name = "omusic"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "An album-first terminal MP3 player for Omarchy and Linux"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.29"
fs2 = "0.4"
id3 = "1"
libc = "0.2"
rand = "0.9"
ratatui = "0.30"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.9"
url = "2"
walkdir = "2"
zbus = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
